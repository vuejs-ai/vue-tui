packages:
  - benchmarks/*
  - packages/*
  - tests/*
  - examples/*
  - templates/*

catalogMode: prefer
# The cloneable template keeps ordinary semver ranges, but matching local package
# versions link while it is managed inside this workspace. Its isolated smoke
# installs the packed release candidates outside the workspace, so root
# overrides and links cannot make their install, types, build, or dev path pass.
linkWorkspacePackages: true

catalog:
  "@alcalzone/ansi-tokenize": ^0.3.0
  "@xterm/addon-unicode11": 0.9.0
  "@xterm/headless": 6.0.0
  ansi-escapes: ^7.3.0
  "@types/node": ^22.18.0
  typescript: ^6.0.3
  # vite: npm:@voidzero-dev/vite-plus-core@latest # Vite+ engine (disabled; on vanilla vite)
  vite: 8.2.1
  vite-plus: 0.2.6
  "@vitejs/plugin-vue-jsx": ^5.1.5
  chalk: ^5.6.2
  patch-console: ^2.0.0
  strip-ansi: ^7.2.0
  node-pty: 1.2.0-beta.13
  tsx: ^4.22.0
  string-width: ^8.0.0
  unplugin-vue: ^7.2.0
  unplugin-vue-jsx: ^0.10.0
  vue-tsc: ^3.3.4
overrides:
  # Pin vite's version spec tree-wide (incl. third-party peer ranges) to the catalog version.
  # "catalog:" tracks catalog.vite — vanilla 8.2.1 now, NOT Vite+ core (core is the commented
  # catalog line above). This is the canonical Vite+ override pattern, just pointed at vanilla.
  vite: "catalog:"
  # Keep @types/node single too, for stable types across the workspace.
  "@types/node": "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  node-pty: true
